# 배포용 Docker 이미지 3개를 GitHub의 컴퓨터에서 빌드해서 GHCR(GitHub의 이미지 보관소)에 올린다.
# 서버는 빌드하지 않고, 여기서 올린 이미지를 docker pull로 받아서 켜기만 한다.
#
# 언제 실행되나: main에 push될 때, 또는 GitHub의 Actions 탭에서 "Run workflow"를 눌렀을 때
# 결과: ghcr.io/eumjeongtae-oss/my-notes-{api,api-migrate,web} (태그: latest, 커밋 해시)
name: 이미지 빌드

on:
  push:
    branches: [main]
    # 문서만 바뀐 push는 이미지가 같으니 빌드하지 않는다
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# 이 작업이 쓸 수 있는 권한. 코드 읽기 + 이미지 보관소에 올리기만
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 이미지 3개를 동시에 따로 빌드한다 (matrix: 아래 목록 하나마다 같은 단계를 한 번씩)
    strategy:
      matrix:
        include:
          - image: my-notes-api
            dockerfile: apps/api/Dockerfile
            target: runner
          # DB 테이블 만들기용. 같은 Dockerfile의 migrator 단계까지만
          - image: my-notes-api-migrate
            dockerfile: apps/api/Dockerfile
            target: migrator
          - image: my-notes-web
            dockerfile: apps/web/Dockerfile
            target: runner
    steps:
      # 레포 코드 가져오기
      - uses: actions/checkout@v5

      # Docker 빌드 도구 준비
      - uses: docker/setup-buildx-action@v3

      # GHCR 로그인. GITHUB_TOKEN은 Actions가 실행될 때마다 자동으로 만들어 주는 임시 열쇠라 따로 비밀 값을 등록할 필요가 없다
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # 저장소 루트가 빌드 재료 (로컬의 docker build ... . 과 같다)
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          # latest: 항상 가장 최근 이미지. 커밋 해시: 문제가 생기면 예전 버전으로 되돌릴 때 쓴다
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          # web 브라우저 코드에 박힐 api 주소 (누구나 볼 수 있는 값이라 여기 적어도 된다). api 이미지는 이 값을 쓰지 않는다
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.chagoknotes.com
          # 빌드 결과를 기억해 두었다가 다음 빌드에 재사용 (바뀐 단계만 다시 빌드해서 빨라진다)
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
