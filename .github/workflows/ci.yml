# 코드 검사 (CI). PR을 만들거나 고칠 때, 그리고 main에 합쳐졌을 때 자동으로 돈다.
# 깨끗한 컴퓨터에서 처음부터 설치하고 format → lint → typecheck → build 순서로 검사한다.
# 하나라도 실패하면 PR 화면에 ❌가 뜬다. main은 곧바로 운영에 배포되니(4-9), 합치기 전에 여기서 막는다.
name: 검사

on:
  pull_request:
  push:
    branches: [main]
    # 문서만 바뀌면 검사할 코드가 없다
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# 같은 PR에 새로 push하면 아직 돌고 있던 예전 검사는 취소한다 (어차피 결과가 쓸모없다)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # api의 next build가 db.ts를 불러올 때 DATABASE_URL이 있는지만 본다. 빌드 중에는 DB에 접속하지 않는다 (Dockerfile과 같은 이유)
      DATABASE_URL: mysql://build:build@localhost:3306/build
    steps:
      - uses: actions/checkout@v5

      # pnpm 설치 (버전은 package.json의 packageManager를 따른다)
      - uses: pnpm/action-setup@v4

      # Node 24 설치. 내려받은 라이브러리를 기억해 두었다가 다음 검사에서 재사용한다
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # 라이브러리 설치. pnpm-lock.yaml과 다르면 실패한다 (내 컴퓨터와 같은 버전 보장)
      # api의 postinstall이 Prisma 클라이언트도 만든다
      - run: pnpm install --frozen-lockfile

      - name: 코드 모양 (Prettier)
        run: pnpm format:check

      - name: 코드 규칙 (ESLint)
        run: pnpm lint

      - name: 타입 검사 (TypeScript)
        run: pnpm typecheck

      - name: 빌드
        run: pnpm build
